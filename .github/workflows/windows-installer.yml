name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/caos/**"
      - "installer/**"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/windows-installer.yml"
  push:
    branches:
      - main
      - feature/windows-installer
      - feature/persistent-settings
    paths:
      - "src/caos/**"
      - "installer/**"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Fetch managed Ollama runtime
        shell: pwsh
        run: |
          $version = "v0.40.1"
          $expected = "B394D14436D38032F23190E3F14EB2C6DAD5EBBE4E192414F74C8FDCA01703AB"
          $zip = Join-Path $env:RUNNER_TEMP "ollama-windows-amd64.zip"
          $url = "https://github.com/ollama/ollama/releases/download/$version/ollama-windows-amd64.zip"
          curl.exe -L --fail --retry 3 --output $zip $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($actual -ne $expected) {
            throw "Ollama runtime checksum mismatch. Expected $expected, got $actual"
          }
          Remove-Item -Recurse -Force .\ollama-runtime -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\ollama-runtime | Out-Null
          Expand-Archive -Path $zip -DestinationPath .\ollama-runtime -Force
          if (-not (Test-Path ".\ollama-runtime\ollama.exe")) {
            throw "ollama.exe was not found in the portable runtime"
          }
          & .\ollama-runtime\ollama.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify version consistency
        shell: pwsh
        run: |
          $project = (Select-String -Path ".\pyproject.toml" -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $runtime = (Select-String -Path ".\src\caos\version.py" -Pattern '^__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          $installer = (Select-String -Path ".\installer\caos.iss" -Pattern '^#define MyAppVersion "([^"]+)"').Matches[0].Groups[1].Value
          if ($project -ne $runtime -or $project -ne $installer) {
            throw "Version mismatch: project=$project runtime=$runtime installer=$installer"
          }

      - name: Build GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name CAOS-Trade-Company --collect-submodules caos --hidden-import tkinter --hidden-import tkinter.ttk --hidden-import tkinter.messagebox installer/company_app.py

      - name: Build CLI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name caos --collect-submodules caos installer/cli_app.py

      - name: Smoke test packaged CLI
        shell: pwsh
        run: |
          $db = Join-Path $env:RUNNER_TEMP "caos-installer-smoke.db"
          & .\dist\caos.exe --provider static --state-db $db status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test packaged GUI launcher
        shell: pwsh
        run: |
          & .\dist\CAOS-Trade-Company.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch pinned Kronos runtime source
        shell: pwsh
        run: |
          $commit = "67b630e67f6a18c9e9be918d9b4337c960db1e9a"
          Remove-Item -Recurse -Force .\third-party\Kronos -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force .\third-party | Out-Null
          git clone --filter=blob:none https://github.com/shiyu-coder/Kronos.git .\third-party\Kronos
          git -C .\third-party\Kronos checkout $commit
          $actual = (git -C .\third-party\Kronos rev-parse HEAD).Trim()
          if ($actual -ne $commit) {
            throw "Kronos source pin mismatch. Expected $commit, got $actual"
          }
          if (-not (Test-Path ".\third-party\Kronos\model")) {
            throw "Pinned Kronos model package is missing"
          }

      - name: Install expert runtime dependencies
        shell: pwsh
        run: |
          python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[experts]"

      - name: Build expert runtime executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name caos-experts --paths .\third-party\Kronos --collect-submodules model --collect-all chronos --collect-all transformers --collect-all tokenizers --collect-all safetensors --collect-all accelerate --collect-all pandas --collect-all pyarrow --hidden-import torch installer/experts_app.py
          if (-not (Test-Path ".\dist\caos-experts.exe")) {
            throw "caos-experts.exe was not created"
          }

      - name: Smoke test packaged expert runtime
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\caos-experts.exe" -ArgumentList "--host","127.0.0.1","--port","11437" -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(45)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:11437/health" -TimeoutSec 2
                if ($health.ok) {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) {
              throw "Packaged expert runtime health check failed"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build CAOS Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc installer\caos.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path ".\installer-output\CAOS-Setup.exe")) {
            throw "CAOS-Setup.exe was not created"
          }

      - name: Build managed expert runtime package
        shell: pwsh
        run: |
          $versionLine = Select-String -Path ".\pyproject.toml" -Pattern '^version = "([^"]+)"'
          if (-not $versionLine) { throw "Project version was not found" }
          $version = $versionLine.Matches[0].Groups[1].Value

          $payload = ".\installer-output\expert-runtime-payload"
          Remove-Item -Recurse -Force $payload -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item ".\dist\caos-experts.exe" "$payload\caos-experts.exe"
          Copy-Item ".\third-party\Kronos\LICENSE" "$payload\LICENSE-Kronos.txt"

          $info = [ordered]@{
            schema = 1
            app_version = $version
            runtime = "caos-experts"
            kronos_commit = "67b630e67f6a18c9e9be918d9b4337c960db1e9a"
            torch = "2.10.0+cpu"
            endpoint = "http://127.0.0.1:11436"
          }
          $info | ConvertTo-Json -Depth 4 | Set-Content "$payload\runtime-info.json" -Encoding UTF8

          $zip = ".\installer-output\CAOS-Experts-Runtime.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "$payload\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) {
            throw "CAOS-Experts-Runtime.zip was not created"
          }

          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            version = $version
            asset = "CAOS-Experts-Runtime.zip"
            sha256 = $sha
            payload = @(
              "caos-experts.exe",
              "LICENSE-Kronos.txt",
              "runtime-info.json"
            )
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content ".\installer-output\CAOS-Experts-Runtime.json" -Encoding UTF8
          Remove-Item -Recurse -Force $payload

      - name: Verify expert runtime manifest hash
        shell: pwsh
        run: |
          $manifest = Get-Content ".\installer-output\CAOS-Experts-Runtime.json" -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -Algorithm SHA256 ".\installer-output\CAOS-Experts-Runtime.zip").Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256) {
            throw "Expert runtime checksum mismatch"
          }

      - name: Build lightweight update package
        shell: pwsh
        run: |
          $versionLine = Select-String -Path ".\pyproject.toml" -Pattern '^version = "([^"]+)"'
          if (-not $versionLine) { throw "Project version was not found" }
          $version = $versionLine.Matches[0].Groups[1].Value

          $payload = ".\installer-output\update-payload"
          Remove-Item -Recurse -Force $payload -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item ".\dist\CAOS-Trade-Company.exe" "$payload\CAOS-Trade-Company.exe"
          Copy-Item ".\dist\caos.exe" "$payload\caos.exe"

          $zip = ".\installer-output\CAOS-Update.zip"
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path "$payload\*" -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "CAOS-Update.zip was not created" }

          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            version = $version
            asset = "CAOS-Update.zip"
            sha256 = $sha
            payload = @(
              "CAOS-Trade-Company.exe",
              "caos.exe"
            )
            preserves = @(
              "%LOCALAPPDATA%\CAOS\caos.db",
              "%LOCALAPPDATA%\CAOS\launcher.json",
              "%LOCALAPPDATA%\CAOS\ollama-models",
              "Windows Credential Manager"
            )
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content ".\installer-output\CAOS-Update.json" -Encoding UTF8
          Remove-Item -Recurse -Force $payload

      - name: Verify update manifest hash
        shell: pwsh
        run: |
          $manifest = Get-Content ".\installer-output\CAOS-Update.json" -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -Algorithm SHA256 ".\installer-output\CAOS-Update.zip").Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256) {
            throw "Update package checksum mismatch"
          }

      - name: Publish stable GitHub Release directly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $manifest = Get-Content ".\installer-output\CAOS-Update.json" -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $sha = $env:GITHUB_SHA

          gh release view $tag --repo $repo *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            $tagSha = (gh api "repos/$repo/git/ref/tags/$tag" --jq ".object.sha").Trim()
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($tagSha -ne $sha) {
              throw "Release $tag already belongs to $tagSha, not $sha. Bump the project version before publishing another release."
            }
            gh release upload $tag `
              ".\installer-output\CAOS-Setup.exe" `
              ".\installer-output\CAOS-Update.zip" `
              ".\installer-output\CAOS-Update.json" `
              ".\installer-output\CAOS-Experts-Runtime.zip" `
              ".\installer-output\CAOS-Experts-Runtime.json" `
              --clobber `
              --repo $repo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag `
              ".\installer-output\CAOS-Setup.exe" `
              ".\installer-output\CAOS-Update.zip" `
              ".\installer-output\CAOS-Update.json" `
              ".\installer-output\CAOS-Experts-Runtime.zip" `
              ".\installer-output\CAOS-Experts-Runtime.json" `
              --repo $repo `
              --target $sha `
              --title "C.A.O.S v$version" `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
