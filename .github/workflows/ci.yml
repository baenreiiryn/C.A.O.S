name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          caos --provider static status
          rm -f /tmp/caos-company-smoke.db*
          caos --provider static --state-db /tmp/caos-company-smoke.db company init --targets BTCUSDT:long:momentum
          caos --provider static --state-db /tmp/caos-company-smoke.db company status
