[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caos-trading-lab"
version = "0.8.2"
description = "C.A.O.S — local-LLM orchestration for a clean-room quantitative trading lab"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "C.A.O.S contributors"}]
keywords = ["local-llm", "ollama", "quant", "paper-trading", "orchestration"]

[project.optional-dependencies]
sentiment = [
  "transformers>=4.48",
  "torch>=2.0",
  "accelerate>=1.0",
]
chronos = [
  "chronos-forecasting>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "torch>=2.0",
]
kronos-runtime = [
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.0",
  "einops==0.8.1",
  "huggingface_hub>=0.33.1",
  "tqdm>=4.67",
  "safetensors>=0.6.2",
]
experts = [
  "transformers>=4.48",
  "accelerate>=1.0",
  "chronos-forecasting>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "torch>=2.0",
  "numpy>=1.26",
  "einops==0.8.1",
  "huggingface_hub>=0.33.1",
  "tqdm>=4.67",
  "safetensors>=0.6.2",
]

[project.scripts]
caos = "caos.cli:main"
caos-company = "caos.windows_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
